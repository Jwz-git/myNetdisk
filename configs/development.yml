# Development 环境配置文件
# 用于本地开发环境

# 数据库配置
database:
  driver: "sqlite"
  path: "data/personal_disk.db"
  host: "127.0.0.1"
  port: "3306"
  user: "root"
  password: ""
  name: "personal_disk"
  charset: "utf8mb4"
  parseTime: true
  location: "Local"

# 服务器配置
server:
  port: "8080"
  host: "127.0.0.1"  # 开发环境只监听本地

# 管理员账号配置
admin:
  username: "admin"
  password: "123456"  # 开发环境默认密码，仅供本地使用

# 文件上传配置
upload:
  directory: "storage"
  maxSize: 104857600    # 开发环境限制为 100MB
  allowedTypes:
    - "jpg"
    - "jpeg"
    - "png"
    - "gif"
    - "webp"
    - "bmp"
    - "tif"
    - "tiff"
    - "svg"
    - "heic"
    - "heif"
    - "avif"
    - "ico"
    - "pdf"
    - "doc"
    - "docx"
    - "odt"
    - "rtf"
    - "txt"
    - "md"
    - "epub"
    - "mobi"
    - "azw3"
    - "xls"
    - "xlsx"
    - "csv"
    - "ods"
    - "ppt"
    - "pptx"
    - "odp"
    - "zip"
    - "rar"
    - "7z"
    - "tar"
    - "gz"
    - "tgz"
    - "bz2"
    - "xz"
    - "zst"
    - "mp3"
    - "wav"
    - "flac"
    - "aac"
    - "m4a"
    - "ogg"
    - "opus"
    - "wma"
    - "mp4"
    - "m4v"
    - "mov"
    - "avi"
    - "mkv"
    - "webm"
    - "flv"
    - "wmv"
    - "mpg"
    - "mpeg"
    - "3gp"
    - "json"
    - "xml"
    - "yaml"
    - "yml"
    - "toml"
    - "ini"
    - "log"
    - "sql"
    - "html"
    - "htm"
    - "css"
    - "js"
    - "ts"
    - "jsx"
    - "tsx"
    - "py"
    - "go"
    - "java"
    - "c"
    - "cpp"
    - "h"
    - "hpp"
    - "rs"
    - "sh"
    - "ttf"
    - "otf"
    - "woff"
    - "woff2"
    - "psd"
    - "ai"
    - "eps"

# 会话配置
session:
  cookieName: "dev_admin_session"
  cookieValue: "dev_admin_logged_in"
  cookiePath: "/"
  maxAge: 7200  # 开发环境2小时过期

# 静态文件配置
static:
  directory: "web/static"
  urlPrefix: "/static/"

# 模板文件配置
templates:
  directory: "web/templates"

# 日志配置
logging:
  level: "debug"        # 开发环境开启调试日志
  file: ""              # 输出到控制台
  maxSize: 100
  maxBackups: 3
  maxAge: 7             # 开发环境保留7天

# 安全配置
security:
  enableCORS: true
  allowedOrigins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "http://localhost:8080"
  enableRateLimit: false  # 开发环境关闭限流

# 应用信息
app:
  name: "Personal Disk (Dev)"
  version: "1.0.0-dev"
  description: "个人网盘系统 - 开发环境"
  author: "Developer"
