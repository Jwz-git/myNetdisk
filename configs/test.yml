# Test 环境配置文件
# 用于测试环境

# 数据库配置
database:
  driver: "sqlite"
  path: "data/personal_disk_test.db"
  host: "127.0.0.1"
  port: "3306"
  user: "test_user"
  password: "test_password"
  name: "personal_disk_test"
  charset: "utf8mb4"
  parseTime: true
  location: "Local"

# 服务器配置
server:
  port: "8081"
  host: "0.0.0.0"

# 管理员账号配置
admin:
  username: "test_admin"
  password: "test123456"

# 文件上传配置
upload:
  directory: "storage_test"
  maxSize: 52428800     # 测试环境限制为 50MB
  allowedTypes:
    - "jpg"
    - "jpeg"
    - "png"
    - "gif"
    - "webp"
    - "bmp"
    - "tif"
    - "tiff"
    - "svg"
    - "heic"
    - "heif"
    - "avif"
    - "ico"
    - "pdf"
    - "doc"
    - "docx"
    - "odt"
    - "rtf"
    - "txt"
    - "md"
    - "epub"
    - "mobi"
    - "azw3"
    - "xls"
    - "xlsx"
    - "csv"
    - "ods"
    - "ppt"
    - "pptx"
    - "odp"
    - "zip"
    - "rar"
    - "7z"
    - "tar"
    - "gz"
    - "tgz"
    - "bz2"
    - "xz"
    - "zst"
    - "mp3"
    - "wav"
    - "flac"
    - "aac"
    - "m4a"
    - "ogg"
    - "opus"
    - "wma"
    - "mp4"
    - "m4v"
    - "mov"
    - "avi"
    - "mkv"
    - "webm"
    - "flv"
    - "wmv"
    - "mpg"
    - "mpeg"
    - "3gp"
    - "json"
    - "xml"
    - "yaml"
    - "yml"
    - "toml"
    - "ini"
    - "log"
    - "sql"
    - "html"
    - "htm"
    - "css"
    - "js"
    - "ts"
    - "jsx"
    - "tsx"
    - "py"
    - "go"
    - "java"
    - "c"
    - "cpp"
    - "h"
    - "hpp"
    - "rs"
    - "sh"
    - "ttf"
    - "otf"
    - "woff"
    - "woff2"
    - "psd"
    - "ai"
    - "eps"

# 会话配置
session:
  cookieName: "test_admin_session"
  cookieValue: "test_admin_logged_in"
  cookiePath: "/"
  maxAge: 3600  # 测试环境1小时过期

# 静态文件配置
static:
  directory: "web/static"
  urlPrefix: "/static/"

# 模板文件配置
templates:
  directory: "web/templates"

# 日志配置
logging:
  level: "info"
  file: "test.log"      # 测试环境输出到文件
  maxSize: 50
  maxBackups: 2
  maxAge: 3

# 安全配置
security:
  enableCORS: true
  allowedOrigins:
    - "http://localhost:3000"
  enableRateLimit: true   # 测试环境开启限流测试
  rateLimit:
    requests: 50
    window: 60

# 应用信息
app:
  name: "Personal Disk (Test)"
  version: "1.0.0-test"
  description: "个人网盘系统 - 测试环境"
  author: "Tester"
