services:
  # MySQL 数据库服务
  db:
    image: mysql:8.0
    container_name: personal_disk_db_prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-personal_disk}
    volumes:
      - mysql-prod-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - personal-disk-prod-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 应用服务
  app:
    build:
      context: ..
      dockerfile: build/Dockerfile
    container_name: personal_disk_app_prod
    restart: unless-stopped
    environment:
      # 生产环境
      APP_ENV: production

      # 数据库配置
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-personal_disk}

      # 服务器配置
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080

      # 管理员配置（必须通过环境变量设置）
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}

      # 上传配置
      UPLOAD_DIRECTORY: uploads
      UPLOAD_MAX_SIZE: 536870912

      # 日志配置
      LOG_LEVEL: warn
      LOG_FILE: /app/logs/app.log
    volumes:
      - uploads-prod-data:/app/uploads
      - logs-prod-data:/app/logs
    ports:
      - "80:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - personal-disk-prod-net

# 数据卷
volumes:
  mysql-prod-data:
    driver: local
  uploads-prod-data:
    driver: local
  logs-prod-data:
    driver: local

# 网络
networks:
  personal-disk-prod-net:
    driver: bridge
