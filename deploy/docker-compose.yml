services:
  # MySQL 数据库服务
  db:
    image: mysql:8.0
    container_name: personal_disk_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-personal_disk}
      MYSQL_USER: ${DB_USER:-}
      MYSQL_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-config:/etc/mysql/conf.d
    ports:
      - "${DB_PORT:-3306}:3306"
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - personal-disk-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 应用服务
  app:
    build:
      context: ..
      dockerfile: build/Dockerfile
    container_name: personal_disk_app
    restart: unless-stopped
    environment:
      # 应用环境
      APP_ENV: ${APP_ENV:-production}

      # 数据库配置（通过环境变量覆盖）
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-personal_disk}

      # 服务器配置
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-8080}

      # 管理员配置（生产环境必须设置）
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # 上传配置
      UPLOAD_DIRECTORY: ${UPLOAD_DIRECTORY:-uploads}
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-536870912}

      # 日志配置
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      LOG_FILE: ${LOG_FILE:-/app/logs/app.log}
    volumes:
      - uploads-data:/app/uploads
      - logs-data:/app/logs
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - personal-disk-net

# 数据卷
volumes:
  mysql-data:
    driver: local
  uploads-data:
    driver: local
  logs-data:
    driver: local

# 网络
networks:
  personal-disk-net:
    driver: bridge