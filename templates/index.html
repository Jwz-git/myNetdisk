<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人网盘</title>
    <link rel="stylesheet" href="/static/css/visitor.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"></span>
                <div>
                    <p class="brand-label">Personal Disk</p>
                    <h1>个人网盘</h1>
                </div>
            </div>
            <nav class="header-actions" aria-label="页面导航">
                <a href="/login" class="nav-link">管理</a>
            </nav>
        </header>
        
        <section class="file-list-section">
            <div class="section-heading">
                <h2>文件</h2>
            </div>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="搜索文件名..." class="search-input">
                <button id="search-btn" class="search-btn">搜索</button>
                <button id="reset-btn" class="reset-btn">重置</button>
            </div>
            <ul id="file-list" class="file-list">
                <!-- 文件项将由JavaScript动态生成 -->
            </ul>
        </section>
        
        <footer>
            <p>© 个人网盘</p>
        </footer>
    </div>
    
    <script src="/static/js/visitor.js"></script>
</body>
</html>
